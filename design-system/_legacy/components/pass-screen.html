<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mafia Master — PassScreen</title>
<style>
  :root{--bg:#0D0F14;--t1:#EDEFF3;--t2:#9AA3B2;--t3:#5C6575;--bd:#2A3140;--gold:#C9A227}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--t1);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    padding:0;display:flex;justify-content:center}
  .phone{width:360px;min-height:560px;padding:40px 28px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;position:relative;
    background:radial-gradient(120% 80% at 50% 12%,#12151c 0%,#0D0F14 60%)}
  .glyph{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;
    justify-content:center;color:#3a4150;font-size:26px;margin-bottom:34px}
  .to{color:var(--t2);font-size:16px}
  .name{font-size:34px;font-weight:700;margin:6px 0 40px;letter-spacing:.01em}
  .hold{position:relative;width:100%;height:56px;border-radius:14px;border:1.5px solid var(--gold);
    color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;overflow:hidden}
  .hold .fill{position:absolute;inset:0 55% 0 0;background:#c9a2271f}
  .hint{margin-top:8px;font-size:11px;color:var(--t3);font-family:"IBM Plex Mono",monospace}
  .not{margin-top:26px;color:var(--t2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
  .tag{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--t3)}
</style>
</head>
<body>
  <div class="phone">
    <div class="tag">Pass screen — used in distribution · night · voting</div>
    <div class="glyph">◆</div>
    <div class="to">Pass the phone to</div>
    <div class="name">«&nbsp;Ahmed&nbsp;»</div>
    <div class="hold"><div class="fill"></div><span>I am Ahmed — hold to confirm</span></div>
    <div class="hint">600ms long-press · no sound · no haptic on open</div>
    <div class="not">Not Ahmed?</div>
  </div>
</body>
</html>
