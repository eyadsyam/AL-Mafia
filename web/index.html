<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="سيد المافيا — لعبة المافيا على تليفون واحد، أو على النت مع أصحابك.">

  <!-- The ground, so the browser chrome and the first paint are the same
       charcoal the app is. A white flash before the first frame on a game
       that is played in a dark room is the one thing a splash must not do. -->
  <meta name="theme-color" content="#0F0F0F">
  <meta name="color-scheme" content="dark">

  <!-- App first. On Android, a game link opened in a browser (a chat's
       in-app browser, a pasted URL) is handed to the installed app through
       an intent; Chrome falls back to this same page, marked ?web=1, when the
       app is not installed. Verified App Links cover the tap-from-chat case
       before any page loads; this covers the rest. Never for the legal
       pages, never twice, never inside the app's own web view. -->
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var path = location.pathname || '/';
        var search = location.search || '';
        if (!/Android/i.test(ua) || /; wv\)/.test(ua)) return;
        if (/[?&]web=1/.test(search)) return;
        if (!/^\/(join\/|invite\/|$)/.test(path)) return;
        if (sessionStorage.getItem('mm.appTried') === path) return;
        sessionStorage.setItem('mm.appTried', path);
        var fallback = location.origin + path + (search ? search + '&' : '?') + 'web=1';
        location.replace('intent://' + location.host + path + search +
          '#Intent;scheme=https;package=com.mafiamaster.mafia_master;' +
          'S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end');
      } catch (e) { /* the web game is always the fallback */ }
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سيد المافيا">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The link preview.

       An invite is sent into a chat, and a chat renders a link as a card
       built from these tags and nothing else - it never runs the app, so
       there is no frame of the game it could show on its own. Without them
       WhatsApp and Telegram fall back to a bare grey rectangle beside a URL,
       which is what a room invite looked like until now.

       Absolute URLs, because the crawler resolves nothing: the same tags are
       served for every path, including /join/CODE. The card is deliberately
       about the game rather than the room - a code in a preview would be a
       code cached by every service that ever scraped the link. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="سيد المافيا">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:url" content="https://saidalmafia.com/">
  <meta property="og:title" content="سيد المافيا">
  <meta property="og:description" content="العب مافيا مع أصحابك أونلاين، أو على تليفون واحد. افتح اللينك وادخل الأوضة على طول.">
  <meta property="og:image" content="https://saidalmafia.com/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="قناع المافيا واسم اللعبة: سيد المافيا">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="سيد المافيا">
  <meta name="twitter:description" content="العب مافيا مع أصحابك أونلاين، أو على تليفون واحد.">
  <meta name="twitter:image" content="https://saidalmafia.com/og-image.jpg">

  <title>سيد المافيا</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0F0F0F; }

    /* Where the film went.
     *
     * A platform view - the real <video> element the browser composites - is
     * placed by the engine as an absolutely positioned box with no `left` of
     * its own plus a translate. A box with no offsets starts at the static
     * position, and in an RTL containing block that is the *right* edge, so
     * the translate was measured from there: the intro was laid out at
     * x = 1435 on a 1366-wide window and never appeared. The panel around it
     * is painted by Flutter onto the canvas and was in the right place all
     * along, which is what made it look like an empty box.
     *
     * The document stays `dir="rtl"`; only the surface Flutter composites is
     * pinned, because Flutter paints its own text direction and never reads
     * this one. `flt-text-editing-host` is a sibling and keeps its RTL, so
     * typing Arabic into a field is untouched. Inherited, so it reaches the
     * shadow tree the scene actually lives in. */
    flt-glass-pane { direction: ltr; }
  </style>
</head>
<body>
  <!-- Web push config (null = push off); read by the app and firebase-messaging-sw.js. -->
  <script src="firebase-config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- What a crawler (and a browser without JavaScript) can read: the game
       itself is drawn on a canvas and has no text of its own to index. -->
  <noscript>
    <main style="max-width:720px;margin:auto;padding:24px;color:#eee;font:18px/1.6 system-ui,sans-serif">
      <h1>سيد المافيا — Mafia Master</h1>
      <p>لعبة مافيا جماعية بأدوار سرية: العبوا أونلاين كل واحد من موبايله مع دردشة صوتية اختيارية، أو على موبايل واحد تتعدّوه في القعدة. واجهة عربية مع دعم الإنجليزية.</p>
      <p lang="en" dir="ltr">A hidden-role Mafia party game: play online, each on your own phone with optional voice chat, or pass one phone around the table. Arabic-first, with English.</p>
      <p>تحتاج تشغيل JavaScript لفتح اللعبة. <a href="/privacy/" style="color:#eacb87">الخصوصية</a> · <a href="/delete-data/" style="color:#eacb87">حذف البيانات</a></p>
    </main>
  </noscript>
</body>
</html>
